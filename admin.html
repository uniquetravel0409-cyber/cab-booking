<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Unique Tours - Admin Control</title>
  <style>
    body { font-family: sans-serif; background-color: #0f1015; color: white; padding: 20px; display: flex; justify-content: center; }
    .admin-card { background: #1a1c23; padding: 25px; border-radius: 12px; width: 100%; max-width: 400px; border: 1px solid #2d3139; }
    input, button { width: 100%; padding: 10px; margin: 8px 0; border-radius: 6px; border: 1px solid #3f444e; box-sizing: border-box; }
    input { background: #12141a; color: white; }
    button { background: #00b894; color: white; font-weight: bold; cursor: pointer; border: none; }
    .hidden { display: none; }
    label { font-size: 13px; color: #00cec9; font-weight: bold; }
  </style>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body>

  <div id="loginBox" class="admin-card">
    <h2>🔒 Admin Login</h2>
    <p style="font-size:12px; color:#a4b0be;">दरें बदलने के लिए एडमिन पासवर्ड दर्ज करें:</p>
    <input type="password" id="adminPass" placeholder="पासवर्ड">
    <button onclick="login()">लॉगिन करें</button>
  </div>

  <div id="dashboard" class="admin-card hidden">
    <h2>⚙️ Live Rate Manager</h2>
    <label>Hatchback Rate (₹/KM):</label>
    <input type="number" id="hatchbackRate">
    <label>Sedan Rate (₹/KM):</label>
    <input type="number" id="sedanRate">
    <label>SUV Rate (₹/KM):</label>
    <input type="number" id="suvRate">
    <label>ड्राइवर भत्ता (Driver Allowance ₹):</label>
    <input type="number" id="driverAllowance">
    <label>टोल टैक्स प्रति KM (Toll Rate ₹):</label>
    <input type="number" id="tollRate" step="0.1">
    <button onclick="saveSettings()">गूगल सर्वर पर सेव करें</button>
  </div>

<script>
  const firebaseConfig = {
    apiKey: "AIzaSyD8jphpAWpQ5PXwIy3LxxQ4xMvngpGx5xs",
    authDomain: "uniqueridetaxi.firebaseapp.com",
    databaseURL: "https://uniqueridetaxi-default-rtdb.firebaseio.com",
    projectId: "uniqueridetaxi",
    storageBucket: "uniqueridetaxi.appspot.com",
    messagingSenderId: "611563174193",
    appId: "1:611563174193:web:4cb11a15ed57a1df761810"
  };

  firebase.initializeApp(firebaseConfig);
  const database = firebase.database();
  const ADMIN_PASSWORD = "1234"; 

  function login() {
    let pass = document.getElementById('adminPass').value;
    if(pass === ADMIN_PASSWORD) {
      document.getElementById('loginBox').classList.add('hidden');
      document.getElementById('dashboard').classList.remove('hidden');
      loadLiveRates();
    } else {
      alert("गलत पासवर्ड!");
    }
  }

  function loadLiveRates() {
    database.ref('cabRates').once('value').then((snapshot) => {
      const rates = snapshot.val() || { hatchback: 12, sedan: 15, suv: 22, driverAllowance: 350, tollRate: 1.6 };
      document.getElementById('hatchbackRate').value = rates.hatchback;
      document.getElementById('sedanRate').value = rates.sedan;
      document.getElementById('suvRate').value = rates.suv;
      document.getElementById('driverAllowance').value = rates.driverAllowance;
      document.getElementById('tollRate').value = rates.tollRate;
    });
  }

  function saveSettings() {
    let newRates = {
      hatchback: parseFloat(document.getElementById('hatchbackRate').value),
      sedan: parseFloat(document.getElementById('sedanRate').value),
      suv: parseFloat(document.getElementById('suvRate').value),
      driverAllowance: parseFloat(document.getElementById('driverAllowance').value),
      tollRate: parseFloat(document.getElementById('tollRate').value)
    };
    
    database.ref('cabRates').set(newRates).then(() => {
      alert("✅ नए रेट्स Google Firebase पर लाइव हो गए हैं!");
    }).catch(err => alert("एरर: " + err.message));
  }
</script>
</body>
</html>
