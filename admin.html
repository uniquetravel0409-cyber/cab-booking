    <script>
        const CORRECT_PASSWORD = "YASMEEN";
        let isInitialLoad = true;

        function checkPassword() {
            if (document.getElementById('adminPassword').value === CORRECT_PASSWORD) {
                document.getElementById('loginOverlay').style.display = 'none';
                document.getElementById('adminPanel').style.display = 'block';
                initAdmin();
            } else {
                document.getElementById('loginError').style.display = 'block';
            }
        }

        // Direct Notification Permission Request
        function requestNotificationPermission() {
            if (typeof Notification === 'undefined') {
                alert("✅ नोटिफिकेशन सिस्टम एक्टिव है।");
                return;
            }

            Notification.requestPermission().then(permission => {
                if (permission === "granted") {
                    alert("✅ नोटिफिकेशन सफलतापूर्वक चालू हो गए हैं!");
                    new Notification("Unique Tour & Travels", { body: "अब आपको नई बुकिंग के अलर्ट मिलते रहेंगे।" });
                } else {
                    alert("⚠️ आपने नोटिफिकेशन की अनुमति ब्लॉक कर दी है।");
                }
            });
        }

        // 🚨 Long Alarm Sound Function (Bajega 10-15 seconds tak)
        function playAlarmSound() {
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                let count = 0;
                
                // Har 0.6 second mein ek beep bajegi, total 15 bar (lagbhag 10-12 seconds)
                const alarmInterval = setInterval(() => {
                    if (count >= 15) {
                        clearInterval(alarmInterval);
                        return;
                    }
                    
                    const oscillator = audioCtx.createOscillator();
                    const gainNode = audioCtx.createGain();
                    
                    oscillator.type = 'sawtooth'; // Alarm jaisi tez awaaz ke liye
                    oscillator.frequency.setValueAtTime(900, audioCtx.currentTime);
                    oscillator.frequency.exponentialRampToValueAtTime(1200, audioCtx.currentTime + 0.3);
                    
                    gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime);
                    
                    oscillator.connect(gainNode);
                    gainNode.connect(audioCtx.destination);
                    
                    oscillator.start();
                    oscillator.stop(audioCtx.currentTime + 0.4);
                    
                    count++;
                }, 600); // Har beep ke beech ka gap
            } catch(e) {}
        }

        function initAdmin() {
            const firebaseConfig = {
                apiKey: "AIzaSyD8jphpAWpQ5PXwIy3LxxQ4xMvngpGx5xs",
                authDomain: "uniqueridetaxi.firebaseapp.com",
                databaseURL: "https://uniqueridetaxi-default-rtdb.firebaseio.com",
                projectId: "uniquetaxi",
                storageBucket: "uniqueridetaxi.firebasestorage.app",
                messagingSenderId: "611563174193",
                appId: "1:611563174193:web:4cb11a15ed57a1df761810"
            };
            if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
            const db = firebase.firestore();
            window.db = db;

            // Realtime Cars List
            db.collection("cars").onSnapshot(snapshot => {
                const tbody = document.getElementById('carsTable');
                tbody.innerHTML = '';
                snapshot.forEach(doc => {
                    const c = doc.data();
                    tbody.innerHTML += `
                        <tr>
                            <td><b>${c.name}</b></td>
                            <td>₹${c.rate}</td>
                            <td>₹${c.bhatta || 0}</td>
                            <td>₹${c.extraHour || 0}</td>
                            <td><button class="btn btn-danger" style="padding:3px 6px; font-size:11px;" onclick="deleteCar('${doc.id}')">X</button></td>
                        </tr>
                    `;
                });
            });

            // Realtime Bookings List with Long Alarm & Popup
            db.collection("bookings").orderBy("timestamp", "desc").onSnapshot(snapshot => {
                const tbody = document.getElementById('bookingsTable');
                
                if (snapshot.empty) {
                    tbody.innerHTML = `<tr><td colspan="5" style="text-align:center; color:#aaa;">कोई नई बुकिंग नहीं है।</td></tr>`;
                    isInitialLoad = false;
                    return;
                }

                if (!isInitialLoad) {
                    snapshot.docChanges().forEach(change => {
                        if (change.type === "added") {
                            const b = change.doc.data();
                            playAlarmSound(); // Play long alarm
                            
                            if (typeof Notification !== 'undefined' && Notification.permission === "granted") {
                                new Notification("🚖 नई कैब बुकिंग आई है!", {
                                    body: `${b.name} (${b.phone}) ने ${b.car} बुक किया है!\nरूट: ${b.pickup} ➔ ${b.drop}`,
                                    icon: "https://cdn-icons-png.flaticon.com/512/3097/3097144.png"
                                });
                            }
                        }
                    });
                }

                isInitialLoad = false;
                tbody.innerHTML = '';
                
                snapshot.forEach(doc => {
                    const b = doc.data();
                    tbody.innerHTML += `
                        <tr>
                            <td><b>${b.name}</b><br><a href="tel:${b.phone}" style="color:#4ba3e3; font-size:12px;">📞 ${b.phone}</a></td>
                            <td><b>${b.car}</b><br><span style="font-size:11px; color:#bbb;">${b.pickup} ➔ ${b.drop}</span></td>
                            <td><span style="color:#ffb400; font-weight:bold;">📅 ${b.bookingDate || 'N/A'}</span><br><span style="font-size:12px; color:#38bdf8;">⏰ ${b.bookingTime || 'N/A'}</span></td>
                            <td style="color:#28a745; font-weight:bold; font-size:14px;">${b.total}</td>
                            <td><button class="btn-danger" onclick="deleteBooking('${doc.id}')">Delete</button></td>
                        </tr>
                    `;
                });
            });
        }

        function saveCarDetails() {
            const name = document.getElementById('carName').value.trim();
            const rate = parseFloat(document.getElementById('carRate').value) || 0;
            const minKm = parseFloat(document.getElementById('minKm').value) || 0;
            const bhatta = parseFloat(document.getElementById('driverBhatta').value) || 0;
            const extraHour = parseFloat(document.getElementById('extraHour').value) || 0;
            const seats = document.getElementById('carSeats').value.trim();
            const discount = parseFloat(document.getElementById('carDiscount').value) || 0;

            if (!name || rate <= 0) {
                alert("Please enter a valid Car Name and Rate/KM.");
                return;
            }

            window.db.collection("cars").doc(name).set({
                name, rate, minKm, bhatta, extraHour, seats, discount
            }).then(() => {
                alert("✅ Vehicle Rate & Details Updated!");
                document.getElementById('carName').value = '';
                document.getElementById('carRate').value = '';
                document.getElementById('minKm').value = '';
                document.getElementById('driverBhatta').value = '';
                document.getElementById('extraHour').value = '';
                document.getElementById('carSeats').value = '';
                document.getElementById('carDiscount').value = '';
            });
        }

        function updateAppContent() {
            const notice = document.getElementById('appNotice').value.trim();
            const terms = document.getElementById('pageContent').value.trim();

            window.db.collection("settings").doc("appConfig").set({
                notice, terms
            }, { merge: true }).then(() => {
                alert("📢 User App Content Updated Successfully!");
            });
        }

        function deleteCar(id) {
            if (confirm("Delete this vehicle?")) {
                window.db.collection("cars").doc(id).delete();
            }
        }

        function deleteBooking(id) {
            if (confirm("क्या आप इस बुकिंग रिकॉर्ड को हटाना चाहते हैं?")) {
                window.db.collection("bookings").doc(id).delete();
            }
        }
    </script>
