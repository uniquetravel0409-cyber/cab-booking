<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unique Tour & Travels - Admin Control Panel</title>
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #1a1e29; color: #e1e6ed; margin: 0; padding: 20px; }
        .container { max-width: 900px; margin: 0 auto; background: #242b3d; padding: 25px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.4); }
        h1 { text-align: center; color: #4ba3e3; margin-bottom: 5px; font-size: 26px; }
        .subtitle { text-align: center; color: #8a99ad; font-size: 14px; margin-bottom: 25px; }
        .card { background: #2d364d; border-radius: 8px; padding: 20px; margin-bottom: 20px; border-left: 4px solid #4ba3e3; }
        .card h2 { margin-top: 0; font-size: 18px; color: #ffb400; display: flex; align-items: center; gap: 8px; }
        .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-bottom: 15px; }
        .form-group { margin-bottom: 10px; }
        label { display: block; font-size: 13px; margin-bottom: 5px; color: #aaa; }
        input, select { width: 100%; padding: 10px; background: #1a1e29; border: 1px solid #3d4966; border-radius: 6px; color: #fff; font-size: 14px; box-sizing: border-box; }
        .btn { background: #34a853; color: white; border: none; padding: 10px 18px; border-radius: 6px; font-weight: bold; cursor: pointer; transition: 0.2s; }
        .btn:hover { background: #2d9247; }
        .btn-delete { background: #ea4335; padding: 6px 10px; font-size: 12px; border: none; border-radius: 4px; color: #fff; cursor: pointer; }
        .btn-delete:hover { background: #c53929; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 14px; }
        th, td { padding: 10px; text-align: left; border-bottom: 1px solid #3d4966; }
        th { background: #1a1e29; color: #4ba3e3; }

        /* Login Screen Overlay */
        #loginOverlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #11141c; display: flex; align-items: center; justify-content: center; z-index: 1000;
        }
        .login-box {
            background: #242b3d; padding: 30px; border-radius: 12px; text-align: center;
            box-shadow: 0 4px 25px rgba(0,0,0,0.6); max-width: 320px; width: 90%;
        }
        .login-box h2 { color: #4ba3e3; margin-top: 0; }
        .login-box input { margin-bottom: 15px; text-align: center; font-size: 18px; letter-spacing: 2px; }
        .error-msg { color: #ea4335; font-size: 13px; margin-top: 10px; display: none; }
    </style>
</head>
<body>

    <!-- 🔒 Password Protection Overlay -->
    <div id="loginOverlay">
        <div class="login-box">
            <h2>🔒 Admin Login</h2>
            <p style="color:#aaa; font-size:13px;">Enter Password to Access Dashboard</p>
            <input type="password" id="adminPassword" placeholder="Enter Password">
            <button class="btn" style="width: 100%;" onclick="checkPassword()">Login</button>
            <div id="loginError" class="error-msg">Incorrect Password! Try again.</div>
        </div>
    </div>

    <!-- 🛠️ Main Admin Panel Content -->
    <div class="container" id="adminDashboard" style="display: none;">
        <div style="display: flex; justify-content: space-between; align-items: center;">
            <h1>Unique Tour & Travels</h1>
            <button onclick="logout()" style="background:#ea4335; color:#fff; border:none; padding:6px 12px; border-radius:4px; cursor:pointer;">Logout 🔒</button>
        </div>
        <div class="subtitle">🛠️ Admin Live Control Dashboard</div>

        <!-- 1. Fleet & Rate Management -->
        <div class="card">
            <h2>🚖 Fleet & Rates Management</h2>
            <div class="form-grid">
                <div class="form-group">
                    <label>Car / Category Name:</label>
                    <input type="text" id="carName" placeholder="e.g., Swift Dzire">
                </div>
                <div class="form-group">
                    <label>Rate per KM (₹):</label>
                    <input type="number" id="carRate" placeholder="e.g., 12">
                </div>
                <div class="form-group">
                    <label>Capacity / Type:</label>
                    <input type="text" id="carSeats" placeholder="e.g., 4 + 1 Seater (Sedan)">
                </div>
                <div class="form-group">
                    <label>Discount (%):</label>
                    <input type="number" id="carDiscount" placeholder="e.g., 5">
                </div>
            </div>
            <button class="btn" onclick="addOrUpdateCar()">➕ Add / Update Car</button>

            <table style="margin-top:20px;">
                <thead>
                    <tr>
                        <th>Car Name</th>
                        <th>Rate/KM</th>
                        <th>Capacity</th>
                        <th>Discount</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="carsList"></tbody>
            </table>
        </div>

        <!-- 2. Realtime Customer Bookings -->
        <div class="card">
            <h2>📋 Received Customer Bookings</h2>
            <table>
                <thead>
                    <tr>
                        <th>Customer</th>
                        <th>Phone</th>
                        <th>Car</th>
                        <th>Route</th>
                        <th>Fare</th>
                    </tr>
                </thead>
                <tbody id="bookingsList"></tbody>
            </table>
        </div>
    </div>

    <script>
        // 🔑 ADMIN PASSWORD
        const CORRECT_PASSWORD = "YASMEEN";

        function checkPassword() {
            const inputPass = document.getElementById('adminPassword').value;
            if (inputPass === CORRECT_PASSWORD) {
                document.getElementById('loginOverlay').style.display = 'none';
                document.getElementById('adminDashboard').style.display = 'block';
                initFirebase();
            } else {
                document.getElementById('loginError').style.display = 'block';
            }
        }

        // Allow pressing "Enter" key to login
        document.getElementById('adminPassword').addEventListener("keyup", function(event) {
            if (event.key === "Enter") {
                checkPassword();
            }
        });

        function logout() {
            location.reload();
        }

        function initFirebase() {
            const firebaseConfig = {
                apiKey: "AIzaSyD8jphpAWpQ5PXwIy3LxxQ4xMvngpGx5xs",
                authDomain: "uniqueridetaxi.firebaseapp.com",
                databaseURL: "https://uniqueridetaxi-default-rtdb.firebaseio.com",
                projectId: "uniqueridetaxi",
                storageBucket: "uniqueridetaxi.firebasestorage.app",
                messagingSenderId: "611563174193",
                appId: "1:611563174193:web:4cb11a15ed57a1df761810",
                measurementId: "G-VGBPZN6JZ5"
            };
            
            if (!firebase.apps.length) {
                firebase.initializeApp(firebaseConfig);
            }
            const db = firebase.firestore();

            // Sync Fleet Realtime
            db.collection("cars").onSnapshot(snapshot => {
                const list = document.getElementById('carsList');
                list.innerHTML = '';
                snapshot.forEach(doc => {
                    const car = doc.data();
                    list.innerHTML += `
                        <tr>
                            <td><b>${car.name}</b></td>
                            <td>₹${car.rate}</td>
                            <td>${car.seats}</td>
                            <td>${car.discount}% Off</td>
                            <td><button class="btn-delete" onclick="deleteCar('${doc.id}')">Delete</button></td>
                        </tr>
                    `;
                });
            });

            // Sync Customer Bookings Realtime
            db.collection("bookings").orderBy("timestamp", "desc").onSnapshot(snapshot => {
                const list = document.getElementById('bookingsList');
                list.innerHTML = '';
                snapshot.forEach(doc => {
                    const b = doc.data();
                    list.innerHTML += `
                        <tr>
                            <td><b>${b.name}</b></td>
                            <td><a href="tel:${b.phone}" style="color:#4ba3e3;">${b.phone}</a></td>
                            <td>${b.car}</td>
                            <td>${b.pickup} ➔ ${b.drop}</td>
                            <td style="color:#2d9247; font-weight:bold;">${b.total}</td>
                        </tr>
                    `;
                });
            });

            window.db = db;
        }

        function addOrUpdateCar() {
            const name = document.getElementById('carName').value.trim();
            const rate = parseFloat(document.getElementById('carRate').value);
            const seats = document.getElementById('carSeats').value.trim();
            const discount = parseFloat(document.getElementById('carDiscount').value) || 0;

            if (!name || isNaN(rate)) {
                alert("Please enter valid Car Name and Rate/KM.");
                return;
            }

            window.db.collection("cars").doc(name).set({ name, rate, seats, discount }).then(() => {
                alert("✅ Car details saved!");
                document.getElementById('carName').value = '';
                document.getElementById('carRate').value = '';
                document.getElementById('carSeats').value = '';
                document.getElementById('carDiscount').value = '';
            });
        }

        function deleteCar(carId) {
            if (confirm("Are you sure you want to delete this car?")) {
                window.db.collection("cars").doc(carId).delete();
            }
        }
    </script>
</body>
</html>
