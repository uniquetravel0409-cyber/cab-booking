<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unique Tour & Travels - Online Cab Booking</title>
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; background: #f4f7f6; margin: 0; padding: 15px; color: #333; }
        .card { max-width: 500px; margin: 0 auto; background: #fff; padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h2 { text-align: center; color: #007bff; margin-bottom: 5px; }
        .sub { text-align: center; font-size: 13px; color: #666; margin-bottom: 20px; }
        .form-group { margin-bottom: 12px; }
        label { font-size: 13px; font-weight: bold; color: #444; display: block; margin-bottom: 4px; }
        input, select { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; font-size: 14px; }
        .btn { width: 100%; background: #28a745; color: white; padding: 12px; border: none; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        .price-box { background: #e9ecef; padding: 12px; border-radius: 6px; margin-top: 15px; text-align: center; font-weight: bold; color: #28a745; font-size: 18px; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Unique Tour & Travels</h2>
        <div class="sub">🚖 Book Your Ride Instantly</div>

        <div class="form-group">
            <label>Select Vehicle:</label>
            <select id="carSelect" onchange="calculateFare()">
                <option value="">-- Loading Vehicles --</option>
            </select>
        </div>

        <div class="form-group">
            <label>Pickup Location:</label>
            <input type="text" id="pickup" placeholder="e.g. Station / Home">
        </div>

        <div class="form-group">
            <label>Drop Location:</label>
            <input type="text" id="drop" placeholder="e.g. Destination">
        </div>

        <div class="form-group">
            <label>Estimated Distance (KM):</label>
            <input type="number" id="distance" placeholder="Enter KM" oninput="calculateFare()">
        </div>

        <div class="form-group">
            <label>Your Name:</label>
            <input type="text" id="custName" placeholder="Enter Full Name">
        </div>

        <div class="form-group">
            <label>Phone Number:</label>
            <input type="tel" id="custPhone" placeholder="10 Digit Mobile No.">
        </div>

        <div class="price-box" id="fareDisplay">Total Fare: ₹0</div>

        <button class="btn" onclick="bookCab()">Confirm Booking 🚖</button>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyD8jphpAWpQ5PXwIy3LxxQ4xMvngpGx5xs",
            authDomain: "uniqueridetaxi.firebaseapp.com",
            databaseURL: "https://uniqueridetaxi-default-rtdb.firebaseio.com",
            projectId: "uniqueridetaxi",
            storageBucket: "uniqueridetaxi.firebasestorage.app",
            messagingSenderId: "611563174193",
            appId: "1:611563174193:web:4cb11a15ed57a1df761810",
            measurementId: "G-VGBPZN6JZ5"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        let carRates = {};

        // Load Live Cars from Firestore
        db.collection("cars").onSnapshot(snapshot => {
            const select = document.getElementById('carSelect');
            select.innerHTML = '<option value="">-- Select Vehicle --</option>';
            carRates = {};
            
            snapshot.forEach(doc => {
                const car = doc.data();
                carRates[car.name] = car.rate;
                select.innerHTML += `<option value="${car.name}">${car.name} (₹${car.rate}/km)</option>`;
            });
        });

        function calculateFare() {
            const car = document.getElementById('carSelect').value;
            const distance = parseFloat(document.getElementById('distance').value) || 0;
            if (car && carRates[car] && distance > 0) {
                const total = distance * carRates[car];
                document.getElementById('fareDisplay').innerText = `Total Fare: ₹${total}`;
            } else {
                document.getElementById('fareDisplay').innerText = `Total Fare: ₹0`;
            }
        }

        function bookCab() {
            const name = document.getElementById('custName').value.trim();
            const phone = document.getElementById('custPhone').value.trim();
            const car = document.getElementById('carSelect').value;
            const pickup = document.getElementById('pickup').value.trim();
            const drop = document.getElementById('drop').value.trim();
            const fare = document.getElementById('fareDisplay').innerText;

            if (!name || !phone || !car || !pickup || !drop) {
                alert("Please fill all details!");
                return;
            }

            db.collection("bookings").add({
                name, phone, car, pickup, drop, total: fare, timestamp: firebase.firestore.FieldValue.serverTimestamp()
            }).then(() => {
                alert("✅ Booking Request Sent Successfully!");
                document.getElementById('custName').value = '';
                document.getElementById('custPhone').value = '';
            });
        }
    </script>
</body>
</html>
